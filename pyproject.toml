[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gget-account-scanner"
version = "0.1.0"
description = "Config-driven layout resolution and image cropping for GGET screenshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "opencv-python-headless>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
gget-scan = "gget_scanner.pipeline.quick_scan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
